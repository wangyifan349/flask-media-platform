{% extends 'base.html' %}
{% block title %}修改密码 · MediaHub{% endblock %}
{% block content %}
<div class="auth-card mx-auto">
    <h1 class="h4 mb-3">修改密码</h1>
    <form method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <div class="mb-3">
            <label class="form-label">当前密码</label>
            <input class="form-control" type="password" name="current_password" required>
        </div>
        <div class="mb-3">
            <label class="form-label">新密码</label>
            <input class="form-control" type="password" name="new_password" minlength="8" required>
        </div>
        <div class="mb-3">
            <label class="form-label">确认新密码</label>
            <input class="form-control" type="password" name="confirm_password" minlength="8" required>
        </div>
        <button class="btn btn-primary" type="submit">保存</button>
    </form>
</div>
{% endblock %}
